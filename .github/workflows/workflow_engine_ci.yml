name: Workflow engine & tickets CI

permissions:
  contents: read

on:
  push:
    branches:
      - 'feat/native-workflow-engine'
  pull_request:
  workflow_dispatch:

# Focused, fast regression gate for the net-new workflow engine + tickets.
# Runs the targeted RSpec + property specs, frontend property specs, and linters
# so every push to the feature branch gets a green check without waiting for the
# full Chatwoot suite.
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379
      WORKFLOW_COVERAGE: 'true'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Prepare test database
        run: bundle exec rake db:test:prepare
      - name: Run workflow + ticket specs (with coverage gate)
        run: |
          bundle exec rspec \
            spec/models/workflow_definition_spec.rb \
            spec/models/workflow_flow_validator_spec.rb \
            spec/models/workflow_execution_spec.rb \
            spec/models/ticket_type_spec.rb \
            spec/models/ticket_spec.rb \
            spec/services/workflows \
            spec/services/tickets \
            spec/jobs/workflows \
            spec/listeners/workflow_listener_spec.rb \
            spec/integration/workflows \
            spec/controllers/api/v1/accounts/workflows_controller_spec.rb \
            spec/controllers/api/v1/accounts/tickets_controller_spec.rb \
            spec/controllers/api/v1/accounts/ticket_types_controller_spec.rb
      - name: Rubocop on new code
        run: |
          bundle exec rubocop --force-exclusion \
            app/models/workflow_definition.rb app/models/workflow_execution.rb \
            app/models/workflow_flow_validator.rb app/models/ticket.rb \
            app/models/ticket_type.rb app/models/ticket_link.rb \
            app/services/workflows app/services/tickets \
            app/jobs/workflows app/listeners/workflow_listener.rb \
            app/controllers/api/v1/accounts/workflows_controller.rb \
            app/controllers/api/v1/accounts/tickets_controller.rb \
            app/controllers/api/v1/accounts/ticket_types_controller.rb

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm i
      - name: Property + unit tests for the canvas
        run: npx vitest run app/javascript/dashboard/routes/dashboard/settings/workflows
      - name: ESLint the workflow UI
        run: npx eslint app/javascript/dashboard/routes/dashboard/settings/workflows
